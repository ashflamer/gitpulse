[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitpulse"
dynamic = ["version"]
description = "Find the risky parts of any git repository: bus factor, churn hotspots, knowledge silos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["git", "analytics", "code-health", "bus-factor", "hotspots", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.hatch.version]
path = "src/gitpulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

# Pin the rule set explicitly. Without this, ruff lints with whatever its
# current defaults are, so a new release can turn a green CI red without a
# single line of code changing.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",            # line length is handled by line-length above
    "RUF001", "RUF002", "RUF003",  # → and × in output/docs are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
