[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitpulse"
dynamic = ["version"]
description = "Find the risky parts of any git repository: bus factor, churn hotspots, knowledge silos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["git", "analytics", "code-health", "bus-factor", "hotspots", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.hatch.version]
path = "src/gitpulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
